; SBR balance controller firmware. Spec: docs/implementation-plan.md (§3).
;
; Versions are pinned (spec §0.5). Change them only deliberately:
;   pioarduino platform 61.04.00 = Arduino-ESP32 4.0.0 on ESP-IDF 6.1.1
;   (riscv32-esp-elf GCC 15.2.0, esptool 5.6.0).

[platformio]
default_envs = s31zero

[env]
extra_scripts = pre:scripts/build_info.py

; ---------------------------------------------------------------- firmware --
[env:s31zero]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
framework = arduino
board = waveshare_esp32s31_zero_n16r16
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
; No libraries yet. ACAN-ESP32FD comes in at Stage 1, the vendored ST driver
; at Stage 1/2 (spec §3).
test_ignore = *

; ------------------------------------------------------ host unit tests --
[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
test_build_src = no
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Isrc
